
server.port=8082

# ===== MySQL Database =====
# Create this database first: CREATE DATABASE hospital_db;
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# Base64-encoded secret, must be long enough for HS384 (>= 48 bytes before encoding)
jwt.secret=NDgzNTQ4NzU5ODc0NTM1NDc1Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItaG9zcGl0YWwtYXBw
jwt.expiration-ms=3600000
